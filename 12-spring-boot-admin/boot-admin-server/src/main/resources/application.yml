server:
  port: 8082

spring:
  application:
    name: spring-boot-admin-server
  security:
    user:
      name: admin
      password: admin123
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
  boot:
    admin:
      discovery:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
