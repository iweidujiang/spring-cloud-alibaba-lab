server:
  port: 7072

spring:
  application:
    name: sentinel-degrade-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
        port: 8720

management:
  endpoints:
    web:
      exposure:
        include: '*'
